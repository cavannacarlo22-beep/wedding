<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Mappa stilizzata: la Tenuta Klopè si trova fra Pizzo, Lamezia Terme e la costa tirrenica">
  <title>Come raggiungere la Tenuta Klopè</title>
  <defs>
    <filter id="mapPaper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85 0.05" numOctaves="3" seed="17" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42 0 0 0 0 0.37 0 0 0 0 0.27 0 0 0 0.18 0"/>
    </filter>
    <pattern id="wave" width="26" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 7 q 6.5 -6 13 0 q 6.5 6 13 0" fill="none" stroke="#9FB0A8" stroke-width="1.1" opacity="0.7"/>
    </pattern>
    <marker id="arrowM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A8804C"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#F5EFE1"/>
  <rect width="1200" height="760" filter="url(#mapPaper)" opacity="0.6"/>

  <!-- ═══ Mar Tirreno ═══ -->
  <path id="seaShape" d="M0 0 L250 0 C 236 120, 300 210, 268 330 C 240 440, 300 540, 258 660 C 236 720, 250 740, 240 760 L0 760 Z" fill="#DDE5DD"/>
  <use href="#seaShape" fill="url(#wave)" opacity="0.45"/>
  <path d="M250 0 C 236 120, 300 210, 268 330 C 240 440, 300 540, 258 660 C 236 720, 250 740, 240 760"
        fill="none" stroke="#8DA097" stroke-width="2.2"/>
  <text x="112" y="400" font-family="Cormorant Garamond, Georgia, serif" font-size="27" fill="#7C8C82"
        letter-spacing="7" transform="rotate(-90 112 400)" text-anchor="middle">MAR TIRRENO</text>

  <!-- ═══ rilievi delle Serre ═══ -->
  <g stroke="#C9BDA1" stroke-width="1.5" fill="none" opacity="0.8" stroke-linecap="round">
    <path d="M886 168 q 34 -38 68 0"/><path d="M962 168 q 34 -38 68 0"/><path d="M1038 168 q 34 -38 68 0"/>
    <path d="M924 214 q 34 -36 68 0"/><path d="M1000 214 q 34 -36 68 0"/>
    <path d="M880 596 q 30 -34 60 0"/><path d="M946 596 q 30 -34 60 0"/>
    <path d="M914 634 q 30 -32 60 0"/>
  </g>
  <text x="996" y="268" font-family="Cormorant Garamond, Georgia, serif" font-size="21" fill="#A2977C"
        letter-spacing="5" text-anchor="middle">SERRE CALABRE</text>

  <!-- ═══ autostrada A2 ═══ -->
  <path d="M556 -10 C 598 140, 640 300, 692 442 C 734 562, 764 662, 794 770"
        stroke="#E6DAC0" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M556 -10 C 598 140, 640 300, 692 442 C 734 562, 764 662, 794 770"
        stroke="#BCAB82" stroke-width="1.8" stroke-dasharray="13 13" fill="none"/>
  <text x="604" y="96" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="15"
        fill="#8A7B52" letter-spacing="3">A2</text>

  <!-- ═══ strade secondarie ═══ -->
  <g stroke="#D2C4A4" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M352 246 C 450 236, 540 254, 628 292"/>
    <path d="M700 396 C 762 374, 826 372, 892 386"/>
    <path d="M704 402 C 666 456, 600 508, 488 534"/>
    <path d="M742 494 C 818 518, 886 522, 952 512"/>
  </g>

  <!-- ═══ percorso consigliato: dall'uscita alla tenuta ═══ -->
  <path d="M678 436 C 628 420, 570 404, 518 396"
        stroke="#B08C57" stroke-width="3.4" fill="none" stroke-dasharray="9 9" marker-end="url(#arrowM)"/>

  <!-- ═══ località ═══ -->
  <g font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="15" fill="#5C5A4B" letter-spacing="2.4">
    <g><circle cx="330" cy="248" r="5.5" fill="#7C8C82"/><text x="346" y="234">PIZZO</text></g>
    <g><circle cx="556" cy="138" r="5.5" fill="#7C8C82"/><text x="572" y="134">LAMEZIA TERME</text></g>
    <g><circle cx="892" cy="386" r="5.5" fill="#7C8C82"/><text x="908" y="382">SERRA S. BRUNO</text></g>
    <g><circle cx="470" cy="540" r="5.5" fill="#7C8C82"/><text x="486" y="558">VIBO VALENTIA</text></g>
    <g><circle cx="692" cy="442" r="5" fill="#B08C57"/><text x="712" y="476" font-size="13" fill="#8A7B52">USCITA PIZZO</text></g>
  </g>

  <!-- ═══ la tenuta ═══ -->
  <g transform="translate(470,400)">
    <text y="-78" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif"
          font-size="31" fill="#3A4232" letter-spacing="4">TENUTA KLOPÈ</text>
    <ellipse cx="0" cy="6" rx="24" ry="7" fill="#9C8F6E" opacity="0.28"/>
    <path d="M0 0 C -26 -32, -19 -62, 0 -62 C 19 -62, 26 -32, 0 0 Z" fill="#3A4232"/>
    <circle cx="0" cy="-42" r="8.5" fill="#E7D9B4"/>
    <text y="32" text-anchor="middle" font-family="Montserrat, Helvetica, Arial, sans-serif"
          font-size="13" fill="#6E6A56" letter-spacing="3">FRANCAVILLA ANGITOLA (VV)</text>
  </g>

  <!-- ═══ rosa dei venti ═══ -->
  <g transform="translate(1074,656)" opacity="0.75">
    <circle r="44" fill="none" stroke="#B9A87E" stroke-width="1.2"/>
    <circle r="32" fill="none" stroke="#B9A87E" stroke-width="0.8" stroke-dasharray="3 5"/>
    <path d="M0 -40 L9 0 L0 40 L-9 0 Z" fill="#3A4232" opacity="0.85"/>
    <path d="M-40 0 L0 -8 L40 0 L0 8 Z" fill="#B08C57" opacity="0.6"/>
    <text y="-52" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="18" fill="#6E6A56">N</text>
  </g>

  <!-- ═══ coordinate e scala ═══ -->
  <g font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="13" fill="#8A8470" letter-spacing="4">
    <text x="62" y="702">38°44′N</text>
    <text x="62" y="726">16°14′E</text>
  </g>
  <g transform="translate(360,700)" opacity="0.8">
    <rect width="120" height="4" fill="#8A8470"/>
    <rect width="60" height="4" fill="#DCCFB0"/>
    <text x="0" y="-9" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="11" fill="#8A8470" letter-spacing="2">0</text>
    <text x="86" y="-9" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="11" fill="#8A8470" letter-spacing="2">10 km</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Mappa stilizzata: Tenuta Klopè fra Pizzo, Lamezia Terme e la costa tirrenica">
  <title>Come raggiungere la Tenuta Klopè</title>
  <defs>
    <filter id="mapPaper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85 0.05" numOctaves="3" seed="17" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42 0 0 0 0 0.37 0 0 0 0 0.27 0 0 0 0.18 0"/>
    </filter>
    <pattern id="wave" width="26" height="14" patternUnits="userSpaceOnUse">
      <path d="M0 7 q 6.5 -6 13 0 q 6.5 6 13 0" fill="none" stroke="#9FB0A8" stroke-width="1.1" opacity="0.75"/>
    </pattern>
    <marker id="arrowM" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A7B52"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#F5EFE1"/>
  <rect width="1200" height="760" filter="url(#mapPaper)" opacity="0.6"/>

  <!-- Mar Tirreno -->
  <path d="M0 0 L250 0 C 236 120, 300 210, 268 330 C 240 440, 300 540, 258 660 C 236 720, 250 740, 240 760 L0 760 Z" fill="#DCE4DC"/>
  <path d="M0 0 L250 0 C 236 120, 300 210, 268 330 C 240 440, 300 540, 258 660 C 236 720, 250 740, 240 760 L0 760 Z" fill="url(#wave)" opacity="0.5"/>
  <path d="M250 0 C 236 120, 300 210, 268 330 C 240 440, 300 540, 258 660 C 236 720, 250 740, 240 760"
        fill="none" stroke="#8A9A8E" stroke-width="2.2"/>
  <text x="96" y="392" font-family="Cormorant Garamond, Georgia, serif" font-size="26" fill="#7C8C82" letter-spacing="6" transform="rotate(-90 96 392)" text-anchor="middle">MAR TIRRENO</text>

  <!-- rilievi stilizzati -->
  <g stroke="#C3B79A" stroke-width="1.6" fill="none" opacity="0.85">
    <path d="M880 150 q 40 -46 80 0 M940 150 q 40 -46 80 0 M1000 150 q 40 -46 80 0"/>
    <path d="M910 200 q 40 -44 80 0 M970 200 q 40 -44 80 0"/>
    <path d="M960 560 q 36 -40 72 0 M1012 560 q 36 -40 72 0"/>
    <path d="M700 660 q 34 -38 68 0 M750 660 q 34 -38 68 0"/>
  </g>
  <text x="1000" y="248" font-family="Cormorant Garamond, Georgia, serif" font-size="19" fill="#A2977C" letter-spacing="4" text-anchor="middle">SERRE CALABRE</text>

  <!-- autostrada A2 -->
  <path d="M560 -10 C 600 140, 640 300, 690 440 C 730 560, 760 660, 790 770"
        stroke="#E3D6B6" stroke-width="15" fill="none" stroke-linecap="round"/>
  <path d="M560 -10 C 600 140, 640 300, 690 440 C 730 560, 760 660, 790 770"
        stroke="#B9A87E" stroke-width="2" stroke-dasharray="12 12" fill="none"/>
  <text x="606" y="120" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="15" fill="#8A7B52" letter-spacing="3">A2</text>

  <!-- strade secondarie -->
  <g stroke="#CFC1A0" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M330 250 C 430 262, 520 300, 616 330"/>
    <path d="M660 392 C 720 372, 800 368, 880 384"/>
    <path d="M642 360 C 600 420, 548 470, 470 520"/>
    <path d="M710 472 C 790 500, 870 506, 950 496"/>
  </g>

  <!-- percorso consigliato dallo svincolo alla tenuta -->
  <path id="route" d="M690 440 C 648 430, 610 412, 576 392 C 540 372, 512 362, 486 356"
        stroke="#B08C57" stroke-width="3.4" fill="none" stroke-dasharray="9 9" marker-end="url(#arrowM)"/>

  <!-- località -->
  <g font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="15" fill="#5C5A4B" letter-spacing="2.4">
    <g><circle cx="330" cy="250" r="5.5" fill="#7C8C82"/><text x="346" y="246">PIZZO</text></g>
    <g><circle cx="560" cy="150" r="5.5" fill="#7C8C82"/><text x="576" y="146">LAMEZIA TERME</text></g>
    <g><circle cx="880" cy="384" r="5.5" fill="#7C8C82"/><text x="896" y="380">SERRA S. BRUNO</text></g>
    <g><circle cx="470" cy="520" r="5.5" fill="#7C8C82"/><text x="486" y="516">VIBO VALENTIA</text></g>
    <g><circle cx="690" cy="440" r="5" fill="#B08C57"/><text x="702" y="462" font-size="13" fill="#8A7B52">USCITA PIZZO</text></g>
  </g>

  <!-- pin Tenuta Klopè -->
  <g transform="translate(486,356)">
    <ellipse cx="0" cy="6" rx="24" ry="7" fill="#9C8F6E" opacity="0.3"/>
    <path d="M0 0 C -26 -32, -19 -62, 0 -62 C 19 -62, 26 -32, 0 0 Z" fill="#3A4232"/>
    <circle cx="0" cy="-42" r="8.5" fill="#E7D9B4"/>
    <g font-family="Cormorant Garamond, Georgia, serif" text-anchor="middle">
      <text y="-80" font-size="30" fill="#3A4232" letter-spacing="4">TENUTA KLOPÈ</text>
      <text y="-56" font-size="0" fill="none"></text>
    </g>
    <text y="34" text-anchor="middle" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="13" fill="#6E6A56" letter-spacing="3">FRANCAVILLA ANGITOLA (VV)</text>
  </g>

  <!-- rosa dei venti -->
  <g transform="translate(1070,650)" opacity="0.75">
    <circle r="44" fill="none" stroke="#B9A87E" stroke-width="1.2"/>
    <circle r="32" fill="none" stroke="#B9A87E" stroke-width="0.8" stroke-dasharray="3 5"/>
    <path d="M0 -40 L9 0 L0 40 L-9 0 Z" fill="#3A4232" opacity="0.85"/>
    <path d="M-40 0 L0 -8 L40 0 L0 8 Z" fill="#B08C57" opacity="0.6"/>
    <text y="-50" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="18" fill="#6E6A56">N</text>
  </g>

  <!-- coordinate decorative -->
  <g font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="13" fill="#8A8470" letter-spacing="4">
    <text x="60" y="700">38°44′N</text>
    <text x="60" y="724">16°14′E</text>
  </g>

  <!-- scala -->
  <g transform="translate(760,706)" opacity="0.8">
    <rect width="120" height="4" fill="#8A8470"/>
    <rect width="60" height="4" fill="#D8CBAC"/>
    <text x="0" y="-8" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="11" fill="#8A8470" letter-spacing="2">0</text>
    <text x="110" y="-8" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="11" fill="#8A8470" letter-spacing="2">10 km</text>
  </g>
</svg>

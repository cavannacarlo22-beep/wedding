      <ellipse cx="1648" cy="196" rx="34" ry="12" transform="rotate(-34 1648 196)"/>
    </g>
    <!-- bottom grasses -->
    <g opacity="0.85">
      <path d="M60 1200 C 70 1120, 40 1080, 30 1040" stroke="#232619" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M130 1200 C 120 1130, 150 1090, 172 1056" stroke="#232619" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M1800 1200 C 1812 1126, 1780 1084, 1762 1050" stroke="#232619" stroke-width="7" fill="none" stroke-linecap="round"/>
      <path d="M1880 1200 C 1868 1140, 1900 1096, 1918 1064" stroke="#232619" stroke-width="6" fill="none" stroke-linecap="round"/>
    </g>

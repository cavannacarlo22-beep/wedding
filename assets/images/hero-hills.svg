<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" width="1920" height="1200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Profilo delle colline calabresi sul mare">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E6E5E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6B5C4E" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#52503F"/>
      <stop offset="100%" stop-color="#41432F"/>

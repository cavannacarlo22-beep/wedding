      <stop offset="55%" stop-color="#9C8B72" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C7461" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="sft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2.2"/></filter>

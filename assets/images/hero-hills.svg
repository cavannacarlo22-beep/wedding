  <!-- sea -->
  <rect y="742" width="1920" height="200" fill="url(#sea)"/>
  <g opacity="0.2" fill="#F4DDB6">
    <rect x="1080" y="760" width="240" height="4"/><rect x="1140" y="790" width="180" height="4"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="400" height="60" aria-hidden="true" focusable="false">
  <defs>
    <!-- foglia a lente, appuntita alle due estremità -->
    <path id="lf" d="M0 0 C 6 -5.5, 15 -6, 22 0 C 15 6, 6 5.5, 0 0 Z"/>
  </defs>

  <!-- filetti laterali -->
  <g stroke="#8C9A83" stroke-width="1" fill="none" stroke-linecap="round" opacity=".8">
    <path d="M16 30 H140"/><path d="M260 30 H384"/>
  </g>

  <!-- rametto d'ulivo: stelo orizzontale, foglie alternate -->
  <g stroke="#7E8E6C" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M146 30 C 168 30, 184 30, 200 30 C 216 30, 232 30, 254 30"/>
  </g>
  <g fill="#7E8E6C">
    <use href="#lf" transform="translate(150,29) rotate(-34) scale(.82)"/>
    <use href="#lf" transform="translate(168,31) rotate(30) scale(.76)"/>
    <use href="#lf" transform="translate(250,31) rotate(146) scale(.82)"/>
    <use href="#lf" transform="translate(232,29) rotate(210) scale(.76)"/>
  </g>
  <g fill="#9AA891" opacity=".85">
    <use href="#lf" transform="translate(186,29) rotate(-24) scale(.62)"/>
    <use href="#lf" transform="translate(214,31) rotate(156) scale(.62)"/>
  </g>

  <!-- oliva dorata al centro -->
  <ellipse cx="200" cy="30" rx="3.4" ry="4.4" fill="#B99A5B"/>
  <circle cx="200" cy="30" r="9" fill="none" stroke="#B99A5B" stroke-width=".7" opacity=".45"/>
</svg>

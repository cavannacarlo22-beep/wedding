<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Heavier cotton-rag stock used for the envelope body -->
  <defs>
    <filter id="cotton" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75 0.06" numOctaves="5" seed="12" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.40  0 0 0 0 0.35  0 0 0 0 0.25  0 0 0 0.34 0"/>
    </filter>
    <filter id="cloud" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004" numOctaves="4" seed="9" result="c"/>
      <feColorMatrix in="c" type="matrix"
        values="0 0 0 0 0.62  0 0 0 0 0.55  0 0 0 0 0.40  0 0 0 0.18 0"/>
    </filter>
    <filter id="speck" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="2.2" numOctaves="1" seed="33" result="s"/>
      <feColorMatrix in="s" type="matrix"
        values="0 0 0 0 0.30  0 0 0 0 0.26  0 0 0 0 0.18  0 0 0 0.16 0"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="#EFE6D4"/>
  <rect width="600" height="600" filter="url(#cloud)"/>
  <rect width="600" height="600" filter="url(#cotton)" opacity="0.6"/>
  <rect width="600" height="600" filter="url(#speck)" opacity="0.45"/>
</svg>

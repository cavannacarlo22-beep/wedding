<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Tileable ivory paper fibre texture -->
  <defs>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.035" numOctaves="4" seed="7" result="n"/>
      <feColorMatrix in="n" type="matrix"
        values="0 0 0 0 0.42  0 0 0 0 0.37  0 0 0 0 0.28  0 0 0 0.30 0"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="1.4" numOctaves="2" seed="21" result="g"/>
      <feColorMatrix in="g" type="matrix"
        values="0 0 0 0 0.32  0 0 0 0 0.28  0 0 0 0 0.20  0 0 0 0.22 0"/>
    </filter>
    <filter id="blotch" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="3" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="0 0 0 0 0.55  0 0 0 0 0.48  0 0 0 0 0.35  0 0 0 0.14 0"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="#F7F2E7"/>
  <rect width="600" height="600" filter="url(#blotch)"/>
  <rect width="600" height="600" filter="url(#fibre)" opacity="0.55"/>
  <rect width="600" height="600" filter="url(#grain)" opacity="0.5"/>
</svg>
